name: Create assignment repo

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CLASSROOM_PAT }}
      ORG: it-ptitsa-mentor
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_REPO: ${{ github.repository }}
      USERNAME: ${{ github.event.issue.user.login }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract assignment
        id: form
        run: |
          # Prefer the assignment: label (set when a repo collaborator adds it by hand).
          # Students opening the "click to sign up" link never have write access to this
          # repo, so GitHub silently drops the link's labels= param for them — title=
          # still comes through fine, so fall back to it when there's no label.
          ASSIGNMENT=$(jq -r '.issue.labels[] | select(.name | startswith("assignment:")) | .name' "$GITHUB_EVENT_PATH" \
            | head -1 | cut -d: -f2)
          if [ -z "$ASSIGNMENT" ]; then
            TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
            if grep -qxF "$TITLE" scripts/assignments.txt; then
              ASSIGNMENT="$TITLE"
            fi
          fi
          # Last fallback: the "Начать задание" issue form puts the dropdown choice in
          # the body under the "### Выберите задание" heading, not in title/label. Strip
          # CR first so the blank line after the heading isn't counted as the value.
          if [ -z "$ASSIGNMENT" ]; then
            CHOICE=$(jq -r '.issue.body' "$GITHUB_EVENT_PATH" \
              | awk '{gsub(/\r/,"")} /^### Выберите задание/{f=1;next} f&&NF{print;exit}')
            if grep -qxF "$CHOICE" scripts/assignments.txt; then
              ASSIGNMENT="$CHOICE"
            fi
          fi
          echo "assignment=$ASSIGNMENT" >> "$GITHUB_OUTPUT"

      - name: Comment if assignment could not be determined
        if: steps.form.outputs.assignment == ''
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPO" \
            --body "Не смог понять, какое задание нужно (нет лейбла assignment:*, а title не совпадает со списком заданий) — напиши ментору."

      - name: Create repo from template and add student
        id: create
        if: steps.form.outputs.assignment != ''
        env:
          ASSIGNMENT: ${{ steps.form.outputs.assignment }}
        run: |
          set -e
          REPO=$(scripts/validate.sh "$ASSIGNMENT" "$USERNAME")
          # Student may already have this repo from an earlier run (re-clicked link,
          # or signed up before a previous fix) — generate/ 422s on name collision,
          # so check first and reuse instead of failing.
          if gh api "repos/$ORG/$REPO" >/dev/null 2>&1; then
            echo "Repo $REPO already exists, reusing it"
          else
            gh api "repos/$ORG/$ASSIGNMENT/generate" \
              -f owner="$ORG" -f name="$REPO" -F private=true \
              -H "Accept: application/vnd.github+json"
          fi
          gh api "repos/$ORG/$REPO/collaborators/$USERNAME" -X PUT -f permission=push
          echo "repo_url=https://github.com/$ORG/$REPO" >> "$GITHUB_OUTPUT"

      - name: Comment result and close issue
        if: steps.form.outputs.assignment != ''
        env:
          REPO_URL: ${{ steps.create.outputs.repo_url }}
          OUTCOME: ${{ steps.create.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPO" --body "Готово: $REPO_URL

          ⚠️ Репозиторий приватный — тебе прислано приглашение как коллаборатору (письмо на почту/уведомление на GitHub). Прими его на странице $REPO_URL/invitations, иначе клонирование даст 404, даже после авторизации."
            gh issue close "$ISSUE_NUMBER" --repo "$ISSUE_REPO"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPO" \
              --body "Не получилось создать репозиторий — напиши ментору."
          fi
